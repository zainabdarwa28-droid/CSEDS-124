<!--Design layouts using float, inline-block, and flexbox.-->
<!DOCTYPE html>
<html>
<head>
<style>
.floatDemo img {
    float: left;
    width: 80px;
    margin-right: 12px;
}
.inlineDemo span {
    display: inline-block;
    width: 120px;
    padding: 15px;
    background: pink;
}
.flexDemo {
    display: flex;
    gap: 10px;
}
.flexDemo div {
    background: lightgreen;
    padding: 15px;
}
</style>
</head>
<body>

<h3>1. Float Layout</h3>
<div class="floatDemo">
    <img src="image.jpg" alt="Example">
    <p>This text flows around the image.</p>
</div>

<h3>2. Inline-Block Layout</h3>
<div class="inlineDemo">
    <span>Box 1</span>
    <span>Box 2</span>
    <span>Box 3</span>
</div>

<h3>3. Flexbox Layout</h3>
<div class="flexDemo">
    <div>Box 1</div>
    <div>Box 2</div>
    <div>Box 3</div>
</div>

</body>
</html>
