<!--reate a responsive webpage using media queries.-->

<!DOCTYPE html>
<html>
<head>
    <title>Responsive Webpage</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        .container {
            display: flex;
            gap: 10px;
        }
        .box {
            background: lightblue;
            padding: 40px;
            flex: 1;
        }
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
            body {
                background: lightyellow;
            }
        }
    </style>
</head>
<body>
    <h1>My Website</h1>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>
</body>
</html>
