<!-- Create forms with HTML5 validation attributes.-->

<!DOCTYPE html>
<html>
<head>
    <title>Experiment 4</title>
</head>
<body>

<header align="center">
    <h2>Form</h2>
</header>

<form align="center" >
    Name:
    <input type="text" placeholder="Enter your name" required>
    <br><br>
    USERNAME:
    <input type="text" placeholder="Enter your username" required>
    <br><br>

    Email:
    <input type="email" placeholder="Enter your email" required>
    <br><br>

    Password:
    <input type="password" placeholder="Enter your password" minlength="6" required>
    <br><br>



    <input type="submit" value="Register">
</form>

</body>
</html>
