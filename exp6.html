<!--Use CSS selectors (class, id, pseudo-classes) for styling.-->
<!DOCTYPE html>
<html lang="en">
    <head>
    <style>
        .heading {
            color: rgb(147, 161, 24);
            text-align: center;
        }
        #para {
            color: rgb(109, 9, 72);
            font-size: 20px;
        }
        .pseudoClass button:hover {
           background:#718fb3; 
           transform:scale(1.05);
        }
    </style>
</head>
<body>
    <h1 class="heading">Class Selector</h1>
    <p id="para">ID selector.</p>
    <div class="pseudoClass">
        <button>click me</button>
    </div>
</body>
</html>
