<!--Use CSS selectors (class, id, pseudo-classes) for styling.-->
<!DOCTYPE html>
<html lang="en">
    <head>
    <style>
        .heading {
            color:darkblue;
            font-size: 30px;
        }
        #para {
            color: violet;
            font-size: 20px;
        }
        button:hover {
            background-color: yellow;
            color: fuchsia;
        }
    </style>
</head>
<body>
    <h1 class="heading"> Class Selector </h1>
    <p id="para">This is an example of ID selector.</p>
    <button> Click </button>
</body>
</html>
